name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/verify.yml
    with:
      full: true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: research-bundle
          path: dist
      - name: Check bundle hashes and source commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(cat COMMIT.txt)" = "$EXPECTED_COMMIT"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/ramanujan-series.zip dist/SHA256SUMS dist/COMMIT.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ramanujan series $TAG_NAME" \
            --generate-notes
