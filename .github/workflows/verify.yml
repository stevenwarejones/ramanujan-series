name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the exhaustive completeness replay (may take tens of minutes)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      full:
        description: Replay the exhaustive completeness search before packaging
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run arithmetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify certificates
        run: python code/verify.py
      - name: Smoke-test benchmark output
        run: python code/benchmark.py --digits 100 --repeats 1
      - name: Replay exhaustive search
        if: inputs.full && matrix.python == '3.12'
        run: python code/verify.py --full
      - name: Check reproduction leaves the checkout clean
        run: test -z "$(git status --porcelain)"

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build bundle from the checked-out commit
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=ramanujan-series/ --output=dist/ramanujan-series.zip HEAD
          git rev-parse HEAD > dist/COMMIT.txt
          cd dist
          sha256sum ramanujan-series.zip COMMIT.txt > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Test and verify the extracted bundle
        run: |
          bundle_check_dir="$(mktemp -d)"
          unzip -q dist/ramanujan-series.zip -d "$bundle_check_dir"
          cd "$bundle_check_dir/ramanujan-series"
          python -m unittest discover -s tests -v
          python code/verify.py
      - name: Upload verified bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14
