name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the exhaustive completeness replay (may take tens of minutes)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify certificates
        run: python code/verify.py
      - name: Replay exhaustive search
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: python code/verify.py --full
